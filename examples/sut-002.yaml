project: "Gazelle v2"
folder_path: "/Gazelle v2/Sut registry/01 - My organization's SUT/SUT-002 - Filter Systems under test list"
reference: "SUT-002"

test_cases:
  - title: '[BR-1] Filter SUT list by "name" criteria'
    weight: HIGH
    prereq: >-
      User is on the SUT Registry "Owned by my organization" tab, with several SUT
      displayed, including at least one with a known name.
    steps:
      - action: 'Enter the exact name of an existing SUT in the "name" search field.'
        expected: "Only the SUT(s) whose name exactly matches the entered value are displayed."
      - action: "Clear the field and enter a partial substring of an existing SUT name."
        expected: "All SUT whose name partially matches (contains) the entered substring are displayed."

  - title: '[BR-2] Filter SUT list by "version" criteria'
    weight: MEDIUM
    prereq: >-
      User is on the SUT Registry "Owned by my organization" tab, with several SUT
      displayed, including at least one with a known version.
    steps:
      - action: 'Enter the exact version of an existing SUT in the "version" search field.'
        expected: "Only the SUT(s) whose version exactly matches the entered value are displayed."
      - action: "Clear the field and enter a partial substring of an existing SUT version."
        expected: "All SUT whose version partially matches (contains) the entered substring are displayed."

  - title: '[BR-3] Filter SUT list by "status" criteria'
    weight: HIGH
    prereq: >-
      The list contains at least one SUT for each of the three statuses
      (Pending Approval, Registered, Withdrawn).
    steps:
      - action: 'Select {STATUS_VALUE} as the "status" search criteria.'
        expected: "Only the SUT whose status matches {STATUS_VALUE} are displayed."
    parameters:
      - STATUS_VALUE
    datasets:
      - name: "Pending Approval"
        values:
          STATUS_VALUE: "Pending Approval"
      - name: "Registered"
        values:
          STATUS_VALUE: "Registered"
      - name: "Withdrawn"
        values:
          STATUS_VALUE: "Withdrawn"

  - title: "[BR-4,5,6,7] Filter SUT list by capability attribute (domain / profile / actor / option)"
    weight: HIGH
    prereq: >-
      At least one SUT has a capability whose {CRITERIA_LABEL} (name or identifier)
      matches a known test value.
    steps:
      - action: 'Enter the exact value for the "{CRITERIA_LABEL}" search field.'
        expected: "All SUT having at least one capability whose {CRITERIA_LABEL} (name or identifier) exactly matches the entered value are displayed."
      - action: 'Clear the field and enter a partial value for "{CRITERIA_LABEL}".'
        expected: "All SUT having at least one capability whose {CRITERIA_LABEL} (name or identifier) partially matches the entered value are displayed."
    parameters:
      - CRITERIA_LABEL
    datasets:
      - name: "domain"
        values:
          CRITERIA_LABEL: "domain"
      - name: "profile"
        values:
          CRITERIA_LABEL: "profile"
      - name: "actor"
        values:
          CRITERIA_LABEL: "actor"
      - name: "option"
        values:
          CRITERIA_LABEL: "option"

  - title: '[BR-8,9] Filter SUT list by "Has dependency errors ?" criteria'
    weight: HIGH
    prereq: >-
      The list contains at least one SUT flagged as having unmet dependencies and
      at least one SUT not flagged as such.
    steps:
      - action: 'Select "{FILTER_VALUE}" for the "Has dependency errors ?" criteria.'
        expected: "{EXPECTED_RESULT}"
    parameters:
      - FILTER_VALUE
      - EXPECTED_RESULT
    datasets:
      - name: "Yes"
        values:
          FILTER_VALUE: "Yes"
          EXPECTED_RESULT: "All SUT flagged as having unmet dependencies are displayed."
      - name: "No"
        values:
          FILTER_VALUE: "No"
          EXPECTED_RESULT: "All SUT not flagged as having unmet dependencies are displayed."
